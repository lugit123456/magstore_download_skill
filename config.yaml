site:
  base_url: "https://lib.magstore.top"
  login_path: "/login"
  home_path: "/"

browser:
  headless_env: "MAGSTORE_HEADLESS"
  channel: "chromium"
  navigation_timeout_ms: 30000
  action_timeout_ms: 15000
  download_timeout_ms: 120000
  storage_state_path: "./state/browser-state.json"

credentials:
  username_env: "MAGSTORE_USERNAME"
  password_env: "MAGSTORE_PASSWORD"

scheduler:
  timezone: "Asia/Shanghai"
  run_time: "07:00"

download:
  base_dir: "/Users/luzhe/Desktop/magstore_download"
  filename_conflict: "skip"
  allowed_extensions: [".pdf"]
  duplicate_check_uncertain: "skip"
  redownload_if_file_missing: false

logging:
  level: "INFO"
  file: "./logs/magstore.log"
  max_bytes: 10485760
  backup_count: 10
  screenshot_dir: "./artifacts/screenshots"

retry:
  login_attempts: 2
  search_attempts: 2
  download_attempts: 2
  backoff_seconds: 5

notifications:
  feishu:
    enabled: true
    webhook_env: "FEISHU_WEBHOOK_URL"
    timeout_seconds: 10
    notify_on_check_failure: true

magazines:
  - id: "wsj"
    enabled: true
    magazine_name: "The Wall Street Journal"
    search_term: "Wall Street Journal"
    match_mode: "prefix"
    schedule:
      type: "daily"
    download_subdir: "the-wall-street-journal"

  - id: "ft"
    enabled: true
    magazine_name: "Financial Times"
    search_term: "Financial Times"
    match_mode: "prefix"
    schedule:
      type: "daily"
    download_subdir: "financial_times"

